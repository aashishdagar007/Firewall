# ──────────────────────────────────────────────────────────────
#  config/os_policies.conf  —  AEGIS XII Phase 4 OS Hardening
#
#  These settings control the HardwareMonitor subsystem which
#  interacts with the host OS directly to mitigate physical threats
#  (Rubber Ducky, Bluetooth/NFC Sniffing, Wardriving).
# ──────────────────────────────────────────────────────────────

# ── USB / Rubber Ducky Mitigation ──
# If true, intercepts global keystrokes to detect injection bursts.
MONITOR_USB = true

# The threshold of typing speed (Words Per Minute) above which
# a USB HID device is auto-blocked at the OS level.
WPM_THRESHOLD = 1000

# ── Wireless Hardware Mitigation ──
# If true, monitors Bluetooth adapters for untrusted pairing 
# attempts and prompts the user on the dashboard.
MONITOR_BLUETOOTH = true

# If true, monitors and intercepts NFC reader activity.
MONITOR_NFC = true
