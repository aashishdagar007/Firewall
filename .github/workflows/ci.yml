name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-fuzz:
    name: Clang parser fuzz smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install fuzz build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake pkg-config libnetfilter-queue-dev libssl-dev \
            libgl1-mesa-dev xorg-dev

      - name: Configure fuzz targets
        run: >-
          cmake -S . -B build-fuzz -DBUILD_TESTING=ON -DENABLE_FUZZING=ON
          -DGLFW_BUILD_WAYLAND=OFF -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build parser fuzzers
        run: cmake --build build-fuzz --target fuzz_packet_parser fuzz_config_parser --parallel 2

      - name: Run bounded parser fuzz sessions
        run: |
          ./build-fuzz/fuzz_packet_parser -runs=10000 -max_len=4096
          ./build-fuzz/fuzz_config_parser -runs=10000 -max_len=4096

  linux:
    name: Ubuntu 24.04 build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config nftables libnetfilter-queue-dev \
            libssl-dev libgl1-mesa-dev xorg-dev

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Check Linux ruleset helper syntax
        run: |
          bash -n scripts/linux-nfq-guard.sh
          sudo nft --check --file scripts/linux-nfq-guard.nft
          sudo nft --file scripts/linux-nfq-guard.nft
          sudo nft --file scripts/linux-nfq-guard.nft
          sudo nft list table inet aegisxii
          sudo nft destroy table inet aegisxii

      - name: Build application and test targets
        run: cmake --build build --parallel 2

      - name: Verify live NFQUEUE allow and block decisions
        run: |
          sudo bash scripts/linux-nfq-guard.sh install
          cleanup() {
            sudo bash scripts/linux-nfq-guard.sh remove || true
          }
          trap cleanup EXIT
          sudo ./build/test_nfq_integration

      - name: Verify systemd unit references and syntax
        run: |
          sudo install -D -m 0755 build/AegisXII /opt/aegisxii/AegisXII
          sudo install -D -m 0755 scripts/linux-nfq-guard.sh /opt/aegisxii/scripts/linux-nfq-guard.sh
          sudo install -D -m 0644 scripts/linux-nfq-guard.nft /opt/aegisxii/scripts/linux-nfq-guard.nft
          sudo systemd-analyze verify packaging/systemd/aegisxii.service

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
