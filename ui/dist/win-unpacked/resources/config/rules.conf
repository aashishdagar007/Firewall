# ──────────────────────────────────────────────────────────────
#  config/rules.conf  —  AEGIS XII Phase 3 Hardened Ruleset
#
#  Format:  ACTION  PROTO  SRC_IP  DST_IP  DST_PORT  "Description"
#
#  ACTION   : ALLOW | BLOCK | BLOCK_PROCESS
#  PROTO    : TCP | UDP | ICMP | ANY
#  SRC_IP   : x.x.x.x  or  *  (any)
#  DST_IP   : x.x.x.x  or  *  (any)
#  DST_PORT : 0-65535  or  *  (any)
#
#  Rules are evaluated TOP TO BOTTOM — first match wins.
#  Anything not matched falls through to the DEFAULT BLOCK policy.
#
#  Phase 3 Hardening (2026-07):
#    Covers threats: 10, 12, 15, 19–27, 28, 30, 33, 38–43
#    RF/physical threats (1–14, 32, 34–37) require OS/hardware controls
#    documented in docs/rf_hardening.md
# ──────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════
#  SECTION 1: Block known bad actors (highest priority)
# ══════════════════════════════════════════════════════════════

BLOCK  ANY   192.168.1.66  *  *  "Block known attacker"
BLOCK  ANY   10.0.0.99     *  *  "Block suspicious internal host"

# ══════════════════════════════════════════════════════════════
#  SECTION 2: Allow loopback (required for localhost)
# ══════════════════════════════════════════════════════════════

ALLOW  ANY   127.0.0.1   *          *    "Allow loopback src"
ALLOW  ANY   *           127.0.0.1  *    "Allow loopback dst"

# ══════════════════════════════════════════════════════════════
#  SECTION 3: LOLBin process blocking (threat 38-41)
#  Prevents Living-Off-the-Land binaries from making network calls.
#  NOTE: BLOCK_PROCESS blocks the named exe from making ANY connection.
# ══════════════════════════════════════════════════════════════

BLOCK_PROCESS "certutil.exe"     "LOLBin: certutil (download/decode cradle)"
BLOCK_PROCESS "bitsadmin.exe"    "LOLBin: bitsadmin (background transfer)"
BLOCK_PROCESS "mshta.exe"        "LOLBin: mshta (HTA execution)"
BLOCK_PROCESS "regsvr32.exe"     "LOLBin: regsvr32 (scrobj.dll C2)"
BLOCK_PROCESS "rundll32.exe"     "LOLBin: rundll32 (DLL sideloading)"
BLOCK_PROCESS "powershell.exe"   "LOLBin: PowerShell (network access policy)"
BLOCK_PROCESS "pwsh.exe"         "LOLBin: PowerShell Core (network access policy)"
BLOCK_PROCESS "installutil.exe"  "LOLBin: installutil (.NET bypass)"
BLOCK_PROCESS "cmstp.exe"        "LOLBin: cmstp (INF file / UAC bypass)"
BLOCK_PROCESS "wscript.exe"      "LOLBin: wscript (script execution)"
BLOCK_PROCESS "cscript.exe"      "LOLBin: cscript (console script host)"
BLOCK_PROCESS "forfiles.exe"     "LOLBin: forfiles (cmd execution)"
BLOCK_PROCESS "BitTorrent.exe"   "Block Torrenting App"
BLOCK_PROCESS "qbittorrent.exe"  "Block qBittorrent"

# ══════════════════════════════════════════════════════════════
#  SECTION 4: WHOIS recon blocking (threat 15)
# ══════════════════════════════════════════════════════════════

BLOCK  TCP   *  *  43    "Block WHOIS port (threat 15)"
BLOCK  TCP   *  *  4321  "Block ARIN WHOIS alt port"

# ══════════════════════════════════════════════════════════════
#  SECTION 5: DNS hardening (threats 15, 21)
#  Only allow DNS to known-good resolvers. Block all others.
#  TCP/53 is always blocked (DNS zone transfer vector).
# ══════════════════════════════════════════════════════════════

ALLOW  UDP   *  1.1.1.1  53   "Allow Cloudflare DNS"
ALLOW  UDP   *  1.0.0.1  53   "Allow Cloudflare DNS secondary"
ALLOW  UDP   *  8.8.8.8  53   "Allow Google DNS"
ALLOW  UDP   *  8.8.4.4  53   "Allow Google DNS secondary"
BLOCK  TCP   *  *        53   "Block DNS zone transfer / TCP DNS (threat 21)"
BLOCK  UDP   *  *        53   "Block DNS to non-trusted resolvers"

# ══════════════════════════════════════════════════════════════
#  SECTION 6: SNMP enumeration (threat 22)
# ══════════════════════════════════════════════════════════════

BLOCK  UDP   *  *  161   "Block SNMP inbound (threat 22)"
BLOCK  UDP   *  *  162   "Block SNMP trap (threat 22)"

# ══════════════════════════════════════════════════════════════
#  SECTION 7: NetBIOS / SMB enumeration (threat 23)
# ══════════════════════════════════════════════════════════════

BLOCK  TCP   *  *  137   "Block NetBIOS Name Service TCP"
BLOCK  UDP   *  *  137   "Block NetBIOS Name Service UDP"
BLOCK  TCP   *  *  138   "Block NetBIOS Datagram TCP"
BLOCK  UDP   *  *  138   "Block NetBIOS Datagram UDP"
BLOCK  TCP   *  *  139   "Block NetBIOS Session"
BLOCK  TCP   *  *  445   "Block SMB direct (EternalBlue / MS17-010)"
BLOCK  TCP   *  *  135   "Block MS-RPC endpoint mapper"

# ══════════════════════════════════════════════════════════════
#  SECTION 8: LDAP enumeration — BloodHound / AD recon (threat 41)
# ══════════════════════════════════════════════════════════════

BLOCK  TCP   *  *  389   "Block LDAP external (BloodHound / AD recon)"
BLOCK  TCP   *  *  636   "Block LDAPS external"
BLOCK  TCP   *  *  3268  "Block Global Catalog LDAP"
BLOCK  TCP   *  *  3269  "Block Global Catalog LDAPS"

# ══════════════════════════════════════════════════════════════
#  SECTION 9: RDP / WinRM — remote lateral movement (threats 28, 38-41)
# ══════════════════════════════════════════════════════════════

BLOCK  TCP   *  *  3389  "Block RDP (brute force / remote exploitation)"
BLOCK  TCP   *  *  5985  "Block WinRM HTTP (lateral movement)"
BLOCK  TCP   *  *  5986  "Block WinRM HTTPS (lateral movement)"

# ══════════════════════════════════════════════════════════════
#  SECTION 10: Known C2 / backdoor ports (threats 38-41)
# ══════════════════════════════════════════════════════════════

BLOCK  TCP   *  *  4444   "Block Metasploit default C2 (Meterpreter)"
BLOCK  TCP   *  *  4445   "Block Metasploit alt C2"
BLOCK  TCP   *  *  1337   "Block leet C2 port"
BLOCK  TCP   *  *  31337  "Block Back Orifice / elite hacker port"
BLOCK  TCP   *  *  9001   "Block Tor OR port"
BLOCK  TCP   *  *  9050   "Block Tor SOCKS proxy"
BLOCK  TCP   *  *  9051   "Block Tor control port"
BLOCK  TCP   *  *  6667   "Block IRC C2 (legacy botnet)"
BLOCK  TCP   *  *  6697   "Block IRC SSL C2"
BLOCK  TCP   *  *  4899   "Block Radmin backdoor"
BLOCK  TCP   *  *  5900   "Block VNC remote access"
BLOCK  TCP   *  *  5800   "Block VNC HTTP viewer"

# ══════════════════════════════════════════════════════════════
#  SECTION 11: IoT exploitation / device discovery (threats 33, 43)
# ══════════════════════════════════════════════════════════════

BLOCK  UDP   *  *  1900   "Block UPnP SSDP (IoT exploitation)"
BLOCK  TCP   *  *  5000   "Block UPnP control port"
BLOCK  UDP   *  *  5353   "Block mDNS (device discovery, threat 10)"
BLOCK  UDP   *  *  5355   "Block LLMNR (credential theft vector)"
BLOCK  UDP   *  *  69     "Block TFTP (insecure firmware update, threat 43)"

# ══════════════════════════════════════════════════════════════
#  SECTION 12: SDR / RF tool web interfaces (threat 14)
# ══════════════════════════════════════════════════════════════

BLOCK  TCP   *  *  8888   "Block RTL-SDR / Jupyter web server"

# ══════════════════════════════════════════════════════════════
#  SECTION 13: Legacy insecure protocols
# ══════════════════════════════════════════════════════════════

BLOCK  TCP   *  *  23    "Block Telnet (cleartext)"
BLOCK  TCP   *  *  21    "Block FTP control (cleartext)"
BLOCK  TCP   *  *  20    "Block FTP data (cleartext)"
BLOCK  TCP   *  *  25    "Block raw SMTP outbound (spam relay)"
BLOCK  TCP   *  *  110   "Block POP3 (cleartext mail)"
BLOCK  TCP   *  *  143   "Block IMAP (cleartext mail)"

# ══════════════════════════════════════════════════════════════
#  SECTION 14: SSH — only from localhost
# ══════════════════════════════════════════════════════════════

ALLOW  TCP   127.0.0.1   *   22   "Allow SSH from localhost only"
BLOCK  TCP   *           *   22   "Block SSH from all external"

# ══════════════════════════════════════════════════════════════
#  SECTION 15: Essential allowed services
# ══════════════════════════════════════════════════════════════

ALLOW  TCP   *  *   443   "Allow HTTPS"
ALLOW  TCP   *  *   8080  "Allow API Server (dashboard)"
ALLOW  TCP   *  *   80    "Allow HTTP"
ALLOW  UDP   *  *   123   "Allow NTP (time sync)"
ALLOW  ICMP  *  *   *     "Allow ICMP (rate-limited by engine)"

# ══════════════════════════════════════════════════════════════
#  DEFAULT: everything else is blocked
#  (enforced by engine default policy = BLOCK in main.cpp)
# ══════════════════════════════════════════════════════════════