# ──────────────────────────────────────────────────────────────
#  config/rules.conf
#
#  Format:  ACTION  PROTO  SRC_IP  DST_IP  DST_PORT  "Description"
#
#  ACTION   : ALLOW | BLOCK
#  PROTO    : TCP | UDP | ICMP | ANY
#  SRC_IP   : x.x.x.x  or  *  (any)
#  DST_IP   : x.x.x.x  or  *  (any)
#  DST_PORT : 0-65535  or  *  (any)
#
#  Rules are evaluated TOP TO BOTTOM — first match wins.
#  Anything not matched falls through to the DEFAULT BLOCK policy.
# ──────────────────────────────────────────────────────────────

# ── Block known bad actors first (highest priority) ───────────
BLOCK  ANY   192.168.1.66  *  *  "Block known attacker"
BLOCK  ANY   10.0.0.99     *  *  "Block suspicious internal host"

# ── Block Known Bad Applications (Endpoint EDR features) ────────
BLOCK_PROCESS "BitTorrent.exe" "Block Torrenting App"
BLOCK_PROCESS "qbittorrent.exe" "Block qBittorrent"

# ── Allow loopback traffic ────────────────────────────────────
ALLOW  ANY   127.0.0.1     *  *  "Allow loopback src"
ALLOW  ANY   *     127.0.0.1  *  "Allow loopback dst"

# ── DNS (required for domain resolution) ─────────────────────
ALLOW  UDP   *  *  53   "Allow DNS queries"

# ── HTTPS ─────────────────────────────────────────────────────
ALLOW  TCP   *  *  443  "Allow HTTPS"

# ── API Server ────────────────────────────────────────────────
ALLOW  TCP   *  *  8080 "Allow API Server"

# ── HTTP ──────────────────────────────────────────────────────
ALLOW  TCP   *  *  80   "Allow HTTP"

# ── SSH: only from localhost ──────────────────────────────────
ALLOW  TCP   127.0.0.1  *  22  "Allow SSH from localhost"
BLOCK  TCP   *          *  22  "Block SSH from all others"

# ── Block Telnet (cleartext, legacy insecure protocol) ────────
BLOCK  TCP   *  *  23   "Block Telnet"

# ── Block FTP data/control (use SFTP instead) ─────────────────
BLOCK  TCP   *  *  20   "Block FTP data"
BLOCK  TCP   *  *  21   "Block FTP control"

# ── SMTP: block outbound to prevent spam relay ────────────────
BLOCK  TCP   *  *  25   "Block raw SMTP outbound"

# ── Allow ICMP (ping / traceroute) ────────────────────────────
ALLOW  ICMP  *  *  *   "Allow ICMP ping"

# ── NTP time sync ─────────────────────────────────────────────
ALLOW  UDP   *  *  123  "Allow NTP"

# ── EVERYTHING ELSE is blocked by the default policy ─────────
# (no explicit rule needed — handled in main.cpp engine default)